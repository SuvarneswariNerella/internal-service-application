version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ioms-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ioms_db
      MYSQL_USER: ioms_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: 
      context: ./backend
    container_name: ioms-backend
    restart: always
    environment:
      - DATABASE_URL=mysql://ioms_user:${DB_PASSWORD:-root}@db:3306/ioms_db
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key_here}
      - PORT=5000
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: ioms-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
