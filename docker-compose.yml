version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ioms_db
      MYSQL_USER: ioms_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: 
      context: ./backend
    restart: always
    environment:
      - DATABASE_URL=mysql://ioms_user:${DB_PASSWORD:-root}@db:3306/ioms_db
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key_here}
      - PORT=5000
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome-stable
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: 
      context: ./frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - default
      - dokploy-network

volumes:
  db_data:

networks:
  dokploy-network:
    external: true
